name: ci

on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.8", "3.9", "3.10", "3.11" ]
    steps:
      -   uses: actions/checkout@v4
      -   uses: actions/setup-python@v5
          with:
            python-version: ${{ matrix.python-version }}
            cache: pip
            cache-dependency-path: requirements_dev.txt
      -   name: Install libmagic (macOS)
          if: runner.os == 'macOS'
          run: brew install libmagic
      -   name: Install dependencies
          run: python -m pip install -r requirements_dev.txt
      -   name: Test with pytest
          run: pytest

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      -   uses: actions/checkout@v4
      -   uses: actions/setup-python@v5
          with:
            python-version: "3.10"
            cache: pip
            cache-dependency-path: requirements_test.txt
      -   name: Install dependencies
          run: python -m pip install -r requirements_test.txt flake8 pylint
      -   name: Lint with flake8
          run: flake8 ./file_validator --count --select=E9,F63,F7,F82 --show-source --statistics
      -   name: Lint with pylint
          run: pylint $(git ls-files './file_validator')

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      -   uses: actions/checkout@v4
      -   uses: actions/setup-python@v5
          with:
            python-version: "3.10"
            cache: pip
            cache-dependency-path: requirements_test.txt
      -   name: Install dependencies
          run: python -m pip install -r requirements_test.txt
      -   name: Test with pytest and measure coverage
          run: pytest --cov=./
      -   name: Report coverage to Coveralls
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            coverage xml -i
            coveralls --service=github

  codeql:
    name: codeql analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      -   uses: actions/checkout@v4
      -   uses: github/codeql-action/init@v3
          with:
            languages: python
      -   uses: github/codeql-action/autobuild@v3
      -   uses: github/codeql-action/analyze@v3
